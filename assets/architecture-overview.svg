<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">IntelliMaint AI system architecture</title><desc id="desc">Streamlit connects to FastAPI, which coordinates ML inference and a SQLAlchemy persistence layer.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#101f35"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#172b45"/><stop offset="1" stop-color="#102039"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#67e8f9"/></marker><style>.title{font:700 34px Inter,Segoe UI,sans-serif;fill:#f8fafc}.sub{font:400 15px Inter,Segoe UI,sans-serif;fill:#9fb3c9}.head{font:700 18px Inter,Segoe UI,sans-serif;fill:#f8fafc}.label{font:600 14px Inter,Segoe UI,sans-serif;fill:#dbeafe}.small{font:400 12px Inter,Segoe UI,sans-serif;fill:#9fb3c9}.tag{font:700 11px Inter,Segoe UI,sans-serif;letter-spacing:1.4px;fill:#67e8f9}.card{fill:url(#panel);stroke:#2b4766;stroke-width:1.2}.node{fill:#0b1a2d;stroke:#31516f;stroke-width:1}.line{fill:none;stroke:#67e8f9;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
<rect width="1440" height="820" rx="28" fill="url(#bg)"/><circle cx="1280" cy="80" r="180" fill="#0ea5e9" opacity=".06"/><circle cx="180" cy="740" r="220" fill="#14b8a6" opacity=".05"/>
<text x="64" y="74" class="tag">INDUSTRIAL INTELLIGENCE / SYSTEM OVERVIEW</text><text x="64" y="124" class="title">IntelliMaint AI</text><text x="64" y="153" class="sub">Physics-grounded telemetry • ML risk estimation • Maintenance operations</text>
