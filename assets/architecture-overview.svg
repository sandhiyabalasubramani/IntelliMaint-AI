<text x="563" y="254" class="tag">02 / SERVICE LAYER</text><text x="563" y="286" class="head">FastAPI REST Backend</text><text x="563" y="309" class="small">Validated APIs and application services</text>
<g><rect class="node" x="563" y="342" width="314" height="52" rx="10"/><text x="583" y="364" class="label">Pydantic validation</text><text x="583" y="382" class="small">Typed request and response schemas</text><rect class="node" x="563" y="407" width="314" height="52" rx="10"/><text x="583" y="429" class="label">Prediction &amp; diagnostics</text><text x="583" y="447" class="small">Risk scoring and contributing factors</text><rect class="node" x="563" y="472" width="314" height="52" rx="10"/><text x="583" y="494" class="label">Maintenance workflow</text><text x="583" y="512" class="small">Work-order lifecycle and status rules</text><rect class="node" x="563" y="537" width="314" height="52" rx="10"/><text x="583" y="559" class="label">OpenAPI documentation</text><text x="583" y="577" class="small">Health endpoint and interactive API docs</text></g>
